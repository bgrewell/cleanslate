# mkosi's Autologin=yes covers tty1, hvc0 and console-getty, but not ttyS0 —
# which is the console this image configures (see KernelCommandLine in
# mkosi.conf.d/10-content.conf). Without this, a serial-attached box and the
# documented qemu recipe both land on a login prompt nothing can satisfy,
# because root's password is locked in a freshly built image.
#
# The -f in the -o argument is load-bearing: it is what makes login skip
# authentication. Without it agetty logs the user in and login then prompts for
# a password anyway, which for a locked account can never succeed.
[Service]
ExecStart=
ExecStart=-agetty -o '-f -p -- \\u' --autologin root --keep-baud 115200,57600,38400,9600 - $TERM
StandardInput=tty
StandardOutput=tty
